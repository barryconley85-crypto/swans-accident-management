name: Accident deadline checks

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accident-deadline-check
  cancel-in-progress: false

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run secure deadline checker
        env:
          CRON_SECRET: ${{ secrets.VERCEL_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing repository secret VERCEL_CRON_SECRET"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://swans-accident-management.vercel.app/api/notifications"
